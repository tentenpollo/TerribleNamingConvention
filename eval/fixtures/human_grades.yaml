# Human calibration grades — FILLED IN BY HAND by the operator.
#
# Run `python -m eval.calibrate --run eval/results/run_<timestamp>.json` to
# produce a draft of this file from the latest run, then edit the 1-5 grades
# below for ~5 questions using the same rubric as the judge:
#   factual_correctness, grounding, conflict_handling
# (conflict_handling = 3 / N/A for non-conflict questions).
#
# When you have filled in human_grades, run calibrate again to compare
# judge vs human agreement and gate interpretation of the full run.
#
# Format: list of maps. `question_id` must match a questions.yaml id.
# `arm` is "cag" or "rag". Scores are integers 1-5.

